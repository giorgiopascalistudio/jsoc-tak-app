# JSOC TAK (ex Re Mida). Target e progetto si chiamano ancora HeltecNav perché il workflow di build li cerca con quel nome
# e perché lo stesso bundle id fa sì che Sideloadly sostituisca l'app installata.
name: HeltecNav
options:
  bundleIdPrefix: com.giorgiopascali
  deploymentTarget:
    iOS: "16.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.3.0
targets:
  HeltecNav:
    type: application
    platform: iOS
    dependencies:
      - target: ReMidaWidget
      - target: ReMidaBroadcast
      - package: MapLibre
        product: MapLibre
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
    sources:
      - path: HeltecNav
      - path: Shared
    info:
      path: HeltecNav/Info.plist
      properties:
        CFBundleDisplayName: JSOC TAK
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations: [it]
        CFBundleShortVersionString: "4.2"
        CFBundleVersion: "42"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.giorgiopascali.jsoctak
            CFBundleURLSchemes: [jsoctak]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [location, audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [remida.novita]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Documenti
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.data, public.content]
        NSLocationWhenInUseUsageDescription: "Posizione per coordinate UTM/MGRS, distanze dagli obiettivi e per marcare foto, audio e QR."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Con 'Sempre' la traccia continua anche con il telefono bloccato."
        NSCameraUsageDescription: "Fotocamera per QR code, testi (OCR), foto, mirino con azimut e lettura del Morse luminoso."
        NSMicrophoneUsageDescription: "Microfono per registrare intercettazioni e note vocali e per decodificare il codice Morse."
        NSSpeechRecognitionUsageDescription: "Trascrizione delle registrazioni direttamente sul telefono."
        NSPhotoLibraryUsageDescription: "Per leggere testi e QR dalle foto della libreria."
        NSPhotoLibraryAddUsageDescription: "Per salvare nella libreria le foto scattate dall'app."
        NSMotionUsageDescription: "Barometro per quota e dislivello."
        NSBluetoothAlwaysUsageDescription: "Bluetooth per accessori di gara (radio, sensori)."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Per raggiungere il server della squadra in rete locale."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giorgiopascali.heltecnav
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ReMidaWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ReMidaWidget
      - path: Shared
    info:
      path: ReMidaWidget/Info.plist
      properties:
        CFBundleDisplayName: JSOC TAK
        CFBundleShortVersionString: "4.2"
        CFBundleVersion: "42"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giorgiopascali.heltecnav.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  ReMidaBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ReMidaBroadcast
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
    info:
      path: ReMidaBroadcast/Info.plist
      properties:
        CFBundleDisplayName: JSOC TAK
        CFBundleShortVersionString: "4.2"
        CFBundleVersion: "42"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giorgiopascali.heltecnav.broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"

  ReMidaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ReMidaWatch
      - path: Shared
      - path: HeltecNav/UTM.swift
    info:
      path: ReMidaWatch/Info.plist
      properties:
        CFBundleDisplayName: JSOC TAK
        CFBundleShortVersionString: "4.2"
        CFBundleVersion: "42"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.giorgiopascali.heltecnav
        WKBackgroundModes: [workout-processing]
        NSLocationWhenInUseUsageDescription: "Posizione per distanza, direzione e UTM sul polso."
        NSHealthShareUsageDescription: "Battiti e calorie durante la missione."
        NSHealthUpdateUsageDescription: "Salva la missione come allenamento."
        CFBundleDevelopmentRegion: it
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giorgiopascali.heltecnav.watchkitapp
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
